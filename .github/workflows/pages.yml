name: pages

# Publishes the already-committed docs/ tree to GitHub Pages. docs/ is
# versioned output (PRIMER A4, "dist/ ist NICHT ignoriert" - the same
# reasoning covers docs/, built by `site` and `sparql` and committed like
# any other product), so there is nothing to rebuild here: this workflow
# only runs once the build workflow's strict gate has already passed on
# main, and hands the tree straight to Pages.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
