name: build

# Rebuilds the whole default pipeline on every push and pull request, and
# fails the moment the SHACL gate goes red (S5 exits non-zero on
# `conforms: False`). `--strict` is deliberately NOT used: it turns every
# build warning into an error, including the known cosmetic ones (urn:
# agent/activity IRIs and blank nodes written by fdo-squirrel, PRIMER
# Nachtrag 2026-11-18), which kept this workflow red without a gate failure.
# Nothing here that `pip install -r requirements.txt && python main.py`
# would not also do on a laptop.
#
# Deliberately excludes `harvest`/`check-updates`: they are network=True and
# already outside the default run (PRIMER A4, "Netzschritt im
# Standardlauf") - main.py filters them out on its own, so no extra flag is
# needed here to keep this workflow from touching Zenodo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the default pipeline (the SHACL gate fails the job)
        run: python main.py
